name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds (strict tsc) and runs every unit, pipeline, regression, fuzz and differential test.
      # Differential tests skip themselves where the reference tool (codesign, hdiutil, xz, …) is absent.
      - run: npm test
      # The package as a customer receives it: pack → install into an empty project → CLI + MCP.
      - run: npm run smoke

  demos:
    name: demos (exit codes are part of the contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: vulnerable demo must BLOCK (exit 2)
        shell: bash
        run: |
          rc=0; npm run demo || rc=$?
          test "$rc" -eq 2 || { echo "expected exit 2 (block), got $rc"; exit 1; }
      - name: fixed demo must PASS (exit 0)
        run: npm run demo:fixed

  action:
    name: GitHub Action (composite, from this checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build && node fixtures/expose-demo/build.mjs
      - name: Run the action on the synthetic release
        id: exposure
        uses: ./
        with:
          path: fixtures/expose-demo/release
      - name: Check the action's outputs
        shell: bash
        env:
          MAX: ${{ steps.exposure.outputs.max-grade }}
          N: ${{ steps.exposure.outputs.findings }}
          MD: ${{ steps.exposure.outputs.report-md }}
        run: |
          test "$MAX" = critical || { echo "max-grade=$MAX, expected critical"; exit 1; }
          test "$N" -gt 0
          test -s "$MD"
