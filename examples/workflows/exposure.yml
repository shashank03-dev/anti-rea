# Example: run the Anti-REA exposure report on every build, attach it to the run, and fail on high-or-worse.
#
# Drop this into .github/workflows/ in your project. Build your release the way you normally do, then point
# Anti-REA at the built artifact. It reads the bytes only; it never runs or modifies your build.
name: Exposure report

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  exposure:
    runs-on: ubuntu-latest # or macos-latest for .app bundles, windows-latest for .exe installers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"

      # --- build your release however you normally do, e.g.: ---
      # - run: npm ci && npm run dist        # Electron
      # - run: ./gradlew assembleRelease     # Android
      # - run: go build -o dist/app ./...    # Go

      - name: Anti-REA exposure report
        # Pin the version you licensed. `--fail-on high` exits 2 when the worst finding is high or critical.
        run: npx --yes anti-rea@0.1.0 expose dist --out anti-rea-exposure --fail-on high

      - name: Attach the report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: anti-rea-exposure
          path: anti-rea-exposure/

      # Release gate (in your release job): blocks until every declared check passes.
      # - run: npx --yes anti-rea@0.1.0 assure --manifest anti-rea.manifest.json --policy anti-rea.policy.json --out anti-rea-report
      #
      # Or use the composite GitHub Action instead of npx:
      # - uses: shashank03-dev/anti-rea@v0.1.0
      #   with: { path: dist, fail-on: high }
